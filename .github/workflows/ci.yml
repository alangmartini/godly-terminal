name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  GODLY_NO_DETACH: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint, type-check, and frontend tests (~5 min)
  # ---------------------------------------------------------------------------
  check-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
        timeout-minutes: 3
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
        timeout-minutes: 3
      - name: Frontend tests
        run: pnpm test
        timeout-minutes: 3
      - name: Validate contract schemas
        run: pnpm exec tsx testing/runner/validate-contracts.ts
        timeout-minutes: 1
      # Check non-Tauri crates individually — godly-terminal's build.rs requires release binaries
      - name: Cargo check (library crates)
        run: >
          cd src-tauri && cargo check
          -p godly-protocol
          -p godly-vt
          -p godly-daemon
          -p godly-pty-shim
          -p godly-llm
          -p godly-whisper
          -p godly-renderer
        timeout-minutes: 8

  # ---------------------------------------------------------------------------
  # Job 2: Unit tests for library crates (parallel matrix, ~5 min each)
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate: [godly-protocol, godly-vt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@nextest
      - name: Test ${{ matrix.crate }}
        run: cd src-tauri && cargo nextest run -p ${{ matrix.crate }} --profile ci
        timeout-minutes: 8

  # ---------------------------------------------------------------------------
  # Job 3: Daemon integration tests (Windows — tests are #[cfg(windows)])
  # ---------------------------------------------------------------------------
  daemon-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@nextest
      - name: Pre-build daemon and pty-shim
        run: cd src-tauri && cargo build -p godly-daemon -p godly-pty-shim
        timeout-minutes: 12
      - name: Daemon tests (partition ${{ matrix.partition }}/3)
        run: >
          cd src-tauri && cargo nextest run -p godly-daemon --profile ci
          --partition hash:${{ matrix.partition }}/3
          -E "not (test(arrow_up_during_multi_session_contention) | test(cold_switch_snapshot_latency_under_contention))"
        timeout-minutes: 10

  # ---------------------------------------------------------------------------
  # Job 4: Build release binaries + app crate tests + frontend build (Windows)
  # ---------------------------------------------------------------------------
  build-and-app-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@nextest
      - name: Build release binaries
        run: >
          cd src-tauri && cargo build --release
          -p godly-daemon
          -p godly-mcp
          -p godly-notify
          -p godly-pty-shim
          -p godly-remote
          -p godly-whisper
          -p godly-iced-shell
        timeout-minutes: 15
      - name: Build app crate tests
        run: cd src-tauri && cargo nextest run -p godly-terminal --profile ci --no-run
        timeout-minutes: 15
      - name: Run app crate tests
        run: cd src-tauri && cargo nextest run -p godly-terminal --profile ci -E "not test(test_cleanup_all_worktrees_with_progress)"
        timeout-minutes: 5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
        timeout-minutes: 3
      - name: Production build
        run: pnpm run build
        timeout-minutes: 8

  # ---------------------------------------------------------------------------
  # Job 5: Native frontend — cargo check all native crates (~5 min)
  # ---------------------------------------------------------------------------
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libvulkan-dev
      - name: Check native crates
        run: >
          cd src-tauri && cargo check
          -p godly-app-adapter
          -p godly-iced-shell
          -p godly-terminal-surface
          -p godly-parity-harness
          -p godly-layout-core
          -p godly-features-shell
          -p godly-ports
          -p godly-tabs-core
          -p godly-testkit
          -p godly-workspaces-core
        timeout-minutes: 12

  # ---------------------------------------------------------------------------
  # Job 6: Contract tests — parity-harness test suite (~3 min)
  # ---------------------------------------------------------------------------
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: taiki-e/install-action@nextest
      - name: Run contract tests
        run: cd src-tauri && cargo nextest run -p godly-parity-harness --profile ci
        timeout-minutes: 5
