[package]
name = "godly-terminal-surface"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Custom Iced widget for rendering terminal grid via wgpu"

[dependencies]
iced.workspace = true
godly-protocol = { path = "../../protocol" }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_Foundation",
] }
