[package]
name = "godly-terminal-surface"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Custom Iced widget for rendering terminal grid via wgpu"

[dependencies]
iced.workspace = true
wgpu = "27"
godly-protocol = { path = "../../protocol" }
log = "0.4"
swash = "0.2"
fontdb = "0.23"

[dev-dependencies]
criterion = "0.5"
godly-vt = { path = "../../godly-vt" }

[[bench]]
name = "render_benchmark"
harness = false

[[bench]]
name = "throughput_stress"
harness = false

[[bench]]
name = "pipeline_benchmark"
harness = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_DirectWrite",
    "Win32_Foundation",
] }
