[workspace]
members = [
    "protocol", "daemon", "mcp", "notify", "godly-vt", "remote", "pty-shim", "whisper",
    "native/app-adapter",
    "native/iced-shell",
    "native/terminal-surface",
    "native/parity-harness",
    "native/layout-core",
    "native/features-shell",
    "native/ports",
    "native/tabs-core",
    "native/testkit",
    "native/workspaces-core",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
godly-protocol = { path = "protocol" }
iced = { version = "0.14", features = ["wgpu", "advanced", "canvas", "tokio", "image"] }

[workspace.dependencies.winapi]
version = "0.3"
features = [
    "processthreadsapi",
    "handleapi",
    "psapi",
    "tlhelp32",
    "winbase",
    "wincon",
    "namedpipeapi",
    "fileapi",
    "errhandlingapi",
    "synchapi",
    "timeapi",
    "winerror",
    "winnt",
    "jobapi2",
    "processenv",
    "winuser",
    "shellapi",
    "windef",
]

[profile.dev]
opt-level = 0
debug = 1         # line tables only — faster builds, still get backtraces
incremental = true

[profile.dev.package."*"]
opt-level = 1     # optimize deps slightly — faster runtime without slow rebuilds

[profile.release]
strip = true
lto = true
